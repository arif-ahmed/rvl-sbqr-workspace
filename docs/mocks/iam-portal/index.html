<!doctype html>
<html lang="en" data-surface="staff">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal IAM · Proposed Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tokens copied from rvl-sbqr-portal/src/index.css so the mock matches the real portal. */
:root{
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --head:'Montserrat','Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --accent:#14935a; --accent-2:#0e7547; --accent-soft:#e3f4eb; --on-accent:#fff;
  --side:#052b52; --side-2:#0a3d70; --side-text:#a9c3de; --side-head:#7897bb;
  --bg:#f4f6f5; --surface:#fff; --surface-2:#f9faf9; --line:#e3e8e5; --line-2:#cdd5d1;
  --text:#101714; --text-2:#46524c; --text-3:#76827c;
  --ok:#14935a; --ok-bg:#e3f4eb; --warn:#9a5b00; --warn-bg:#fff2d9; --bad:#c4302b; --bad-bg:#fdeceb; --info:#1d5fb8; --info-bg:#e8f0fc;
  --new:#7a3fd1; --new-bg:#f1e9fc;
  --shadow:0 1px 2px rgba(16,23,20,.04),0 4px 16px rgba(16,23,20,.04);
  --mb:78px;
}
html[data-surface="fi"]{--accent:#1c56c9;--accent-2:#1444a3;--accent-soft:#e6eefc;--side:#0a2f66;--side-2:#12428a;--side-text:#b3c8ec;--side-head:#84a0d2}
@media (prefers-color-scheme:dark){
  html:not([data-theme="light"]){
    --bg:#0c0f0e;--surface:#141917;--surface-2:#181e1b;--line:#252d29;--line-2:#37413c;--text:#edf2ef;--text-2:#a8b4ae;--text-3:#78857e;--shadow:none;
    --accent:#2fc27f;--accent-2:#52d99a;--accent-soft:#12372a;--on-accent:#05130c;--side:#04162b;--side-2:#082440;
    --ok:#3ccf8a;--ok-bg:#12372a;--warn:#f0b24d;--warn-bg:#3a2b0f;--bad:#ff7d78;--bad-bg:#3d1c1b;--info:#7db2ff;--info-bg:#172a46;--new:#b794f4;--new-bg:#2a1f45}
  html[data-surface="fi"]:not([data-theme="light"]){--accent:#6a9bff;--accent-2:#8fb4ff;--accent-soft:#16294f;--on-accent:#06122b}
}
html[data-theme="dark"]{
  --bg:#0c0f0e;--surface:#141917;--surface-2:#181e1b;--line:#252d29;--line-2:#37413c;--text:#edf2ef;--text-2:#a8b4ae;--text-3:#78857e;--shadow:none;
  --accent:#2fc27f;--accent-2:#52d99a;--accent-soft:#12372a;--on-accent:#05130c;--side:#04162b;--side-2:#082440;
  --ok:#3ccf8a;--ok-bg:#12372a;--warn:#f0b24d;--warn-bg:#3a2b0f;--bad:#ff7d78;--bad-bg:#3d1c1b;--info:#7db2ff;--info-bg:#172a46;--new:#b794f4;--new-bg:#2a1f45}
html[data-theme="dark"][data-surface="fi"]{--accent:#6a9bff;--accent-2:#8fb4ff;--accent-soft:#16294f;--on-accent:#06122b}

*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/20px var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-2);text-decoration:none}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- mock control bar (not part of the proposal) ---------- */
#chrome{position:sticky;top:0;z-index:100}
#addr{height:34px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--surface-2);border-bottom:1px solid var(--line);font:12.5px var(--mono);color:var(--text-2);white-space:nowrap;overflow:hidden}
#addr b{color:var(--text);font-weight:500}
#addr .pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;display:flex;gap:8px;align-items:center}
#mockbar{height:44px;background:#1b1530;color:#d9d0f3;display:flex;align-items:center;gap:14px;padding:0 16px;font-size:12.5px;overflow-x:auto;white-space:nowrap}
#mockbar b{color:#fff;font-family:var(--head)}
#mockbar select,#mockbar button{background:#2b2250;color:#fff;border:1px solid #4a3d82;border-radius:8px;padding:5px 9px;font-size:12.5px}
#mockbar button.on{background:var(--new);border-color:var(--new)}
#mockbar .sp{flex:1}
#mockbar label{display:flex;align-items:center;gap:6px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:244px 1fr;min-height:calc(100svh - var(--mb))}
.side{background:var(--side);color:var(--side-text);padding:18px 14px;position:sticky;top:var(--mb);height:calc(100svh - var(--mb));overflow:auto}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font:700 14px var(--head);padding:4px 8px 18px}
.logo{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--accent-2);display:grid;place-items:center}
.brand small{display:block;font:500 11px var(--font);color:var(--side-head)}
.nav-h{font:600 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--side-head);padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:999px;color:var(--side-text);font-weight:500;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:var(--accent);color:var(--on-accent)}
.nav a .tag{margin-left:auto}
.tag{font:700 9.5px var(--font);letter-spacing:.05em;text-transform:uppercase;background:var(--new);color:#fff;border-radius:999px;padding:2px 7px}
.main{min-width:0}
.top{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:var(--mb);z-index:20}
.top h1{font:700 18px var(--head)}
.top .sp{flex:1}
.acct{display:flex;align-items:center;gap:10px;border:1px solid transparent;border-radius:999px;padding:3px 12px 3px 3px;background:none;position:relative}
.acct:hover{border-color:var(--line);background:var(--surface-2)}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:700;font-size:12px}
.acct .who{text-align:left;line-height:16px}.acct .who b{display:block;font-size:13px}.acct .who span{font-size:11.5px;color:var(--text-3)}
.menu{position:absolute;right:0;top:46px;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);overflow:hidden;z-index:40;text-align:left}
.menu .h{padding:11px 14px;border-bottom:1px solid var(--line)}
.menu button{display:flex;gap:10px;width:100%;padding:10px 14px;border:0;background:none;text-align:left}
.menu button:hover{background:var(--surface-2)}
.content{max-width:1360px;padding:28px}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-h h2{font:700 24px/30px var(--head);letter-spacing:-.01em}
.page-h p{margin:4px 0 0;color:var(--text-2)}
.page-h .sp{flex:1}

/* ---------- components ---------- */
.btn{height:38px;padding:0 15px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn.sm{height:30px;padding:0 11px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px 2px 8px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:var(--ok-bg)}.chip.warn{color:var(--warn);background:var(--warn-bg)}.chip.bad{color:var(--bad);background:var(--bad-bg)}.chip.info{color:var(--info);background:var(--info-bg)}
.chip.plain{color:var(--text-2);background:var(--surface-2);border:1px solid var(--line)}.chip.plain:before{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:18px}
.card-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font:600 15px var(--font)}.card-h .sp{flex:1}
.card-b{padding:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{color:var(--text-3);font-size:12.5px}.kpi b{display:block;font:600 26px/34px var(--font)}
table{width:100%;border-collapse:collapse}
th{background:var(--surface-2);text-align:left;font-size:12px;font-weight:600;color:var(--text-2);padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.u-name b{display:block}.u-name span{color:var(--text-3)}
.empty{padding:36px;text-align:center;color:var(--text-3)}
.filters{display:flex;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.field .hint{color:var(--text-3);font-size:12.5px;margin-top:4px}
.field .err{color:var(--bad);font-size:12.5px;margin-top:4px}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line-2);border-radius:9px;height:38px;padding:0 12px;width:100%}
.filters input,.filters select{width:auto;min-width:150px}
.filters input.search{min-width:240px}
input[readonly]{background:var(--surface-2);color:var(--text-2)}
.banner{display:flex;gap:12px;border-radius:10px;padding:12px 14px;margin-bottom:14px;border:1px solid transparent}
.banner b{display:block}.banner p{margin:2px 0 0}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.bad{background:var(--bad-bg);color:var(--bad)}.banner.info{background:var(--info-bg);color:var(--info)}.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner .act{margin-left:auto;align-self:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs a{padding:10px 14px;color:var(--text-2);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tabs a.on{color:var(--accent-2);border-color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;background:var(--surface);z-index:61;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.drawer-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer-h h3{font:700 18px var(--head)}.drawer-h .sp{flex:1}
.drawer-b{padding:20px;overflow:auto;flex:1}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:480px;max-width:calc(100% - 32px);background:var(--surface);border-radius:14px;z-index:71;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:22px}
.dialog h3{font:700 18px var(--head);margin-bottom:6px}
.dialog .f{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.scrim.d{z-index:70}
.dl{display:grid;grid-template-columns:130px 1fr;gap:9px 14px;margin:0 0 20px}
.dl dt{color:var(--text-3)}.dl dd{margin:0}
.sec-h{font:600 12px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);margin:22px 0 10px}
.actions{display:grid;gap:8px}
.actions .btn{justify-content:flex-start;width:100%}
.secret{font-family:var(--mono);font-size:16px;letter-spacing:.04em;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;word-break:break-all}
.toast{position:fixed;top:calc(var(--mb) + 14px);left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad)}
.stepper{display:flex;gap:0;margin-bottom:22px;counter-reset:s;flex-wrap:wrap}
.stepper button{flex:1;min-width:130px;display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-bottom:3px solid var(--line);background:none;text-align:left;color:var(--text-3);font-weight:600;cursor:pointer}
.stepper button i{font-style:normal;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:12px}
.stepper button.done{color:var(--ok);border-color:var(--ok)}.stepper button.done i{background:var(--ok);color:#fff;border-color:var(--ok)}
.stepper button.on{color:var(--accent-2);border-color:var(--accent)}
.row-s{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row-s:last-child{border:0}.row-s .sp{flex:1}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;background:var(--ok)}.dot.todo{background:var(--warn)}
.me{font-size:12px;color:var(--text-3);margin-left:6px}
.stub{border:1px dashed var(--line-2);border-radius:12px;padding:40px;text-align:center;color:var(--text-3);background:var(--surface)}

/* ---------- proposal annotations ---------- */
.note{display:none;border:1.5px dashed var(--new);background:var(--new-bg);color:var(--text);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:13px}
body.notes .note{display:block}
.note h4{margin:0 0 6px;font:700 12px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--new)}
.note ul{margin:0;padding-left:18px}.note li{margin:2px 0}
.note code,td code{font-family:var(--mono);font-size:12px;background:rgba(122,63,209,.1);padding:1px 5px;border-radius:5px}

/* ---------- login ---------- */
.login{display:grid;grid-template-columns:1.05fr 1fr;min-height:calc(100svh - var(--mb))}
.login .hero{background:linear-gradient(135deg,var(--side),var(--side-2));color:#fff;padding:44px;display:flex;flex-direction:column;justify-content:space-between}
.login .hero h2{font:700 32px/40px var(--head);max-width:16ch;margin:0 0 14px}
.login .form{display:grid;place-items:center;padding:32px}
.login .form>div{width:100%;max-width:420px}
.login h1{font:700 26px/32px var(--head);margin-bottom:6px}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px dashed var(--new)}
.qa small{width:100%;color:var(--new);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:11px}
.center{min-height:calc(100svh - var(--mb));display:grid;place-items:center;padding:24px;background:var(--surface-2)}
.center .card{max-width:440px;width:100%}

@media (max-width:900px){
  .app{grid-template-columns:1fr}.side{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .login{grid-template-columns:1fr}.login .hero{display:none}
  .content{padding:18px 16px}.top{padding:0 16px}
  .dl{grid-template-columns:1fr}
}
</style>
</head>

const S = {
  persona:'admin', host:'admin', data:seed(), notes:true,
  f:{q:'',scope:'',tenant:'',role:'',status:''},
  drawer:null,      // {kind:'user'|'create'|'edit', id, ...}
  dialog:null,      // confirm / secret
  draft:{}, err:{}, menu:false, onbStep:5, onbCreated:false, banner:null, pwErr:'',

const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const me = ()=>{
  if(S.persona==='anon') return null;
  const u = user(PERSONA_USER[S.persona] || S.persona); if(!u) return null;
  return {userId:u.id,surface:u.tenantId?'fi':'staff',role:u.role,name:u.displayName,username:u.username,title:TITLES[u.role],tenantId:u.tenantId||undefined};
};
const tenantBySlug = (slug)=> S.data.tenants.find(t=>t.slug===slug);
const hostOfUser = (u)=> u.tenantId ? tenant(u.tenantId).slug : 'admin';
// What a browser at this address would be talking to. Terminated tenants disappear like unknown ones.
const hostKind = ()=> S.host==='admin' ? 'admin' : (tenantBySlug(S.host) && tenantBySlug(S.host).status!=='Terminated') ? 'fi' : 'unknown';
const tenant = (id)=> S.data.tenants.find(t=>t.id===id);
const user = (id)=> S.data.users.find(u=>u.id===id);
const initials = (n)=> n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();

/* =====================================================================
   Nav
   ===================================================================== */
function navFor(p){
  if(p.surface==='staff'){
    const n=[
      {to:'/staff/overview',label:'Overview',icon:'home',stub:1},
      {to:'/staff/institutions',label:'Institutions',icon:'bldg'},
      {to:'/staff/trust-store',label:'Trust store',icon:'shield',stub:1},
      {h:'Billing'},
      {to:'/staff/rates',label:'Rate cards',icon:'card',stub:1},
      {to:'/staff/periods',label:'Billing periods',icon:'file',stub:1},
      {h:'Platform'},
      {to:'/staff/keys',label:'Crypto keys',icon:'key',stub:1},
      {to:'/staff/inspector',label:'QR inspector',icon:'qr',stub:1},
    ];
    if(p.role==='MASTER_ADMIN'){ n.push({h:'Access'},{to:'/staff/users',label:'Users',icon:'users',tag:'New'}); }
    return n;
  }
  const n=[

function shell(title, body){
  const p=me(); const path=route().path;
  const nav=navFor(p).map(i=> i.h ? `<div class="nav-h">${i.h}</div>` :
    `<a href="#${i.to}" class="${path===i.to||path.startsWith(i.to+'/')?'on':''}">${ic(i.icon)} ${i.label}${i.tag?`<span class="tag">${i.tag}</span>`:''}</a>`).join('');
  const t = p.tenantId ? tenant(p.tenantId).name : 'Relief Validation Ltd';
  return `<div class="app">
    <aside class="side">
      <div class="brand"><span class="logo">${ic('qr',20)}</span><div>Secure Bangla QR<small>${p.surface==='staff'?'Staff console':'Institution portal'}</small></div></div>
      <nav class="nav">${nav}</nav>
    </aside>
    <div class="main">
      <header class="top">
        <h1>${esc(title)}</h1><span class="sp"></span>
        ${p.surface==='fi'?`<span class="chip plain">${esc(t)}</span>`:''}
        <button class="acct" data-act="menu" aria-label="Account menu"><span class="av">${initials(p.name)}</span><span class="who"><b>${esc(p.name)}</b><span>${esc(p.title)}</span></span>
          ${S.menu?`<div class="menu" onclick="event.stopPropagation()"><div class="h"><b>${esc(p.name)}</b><div class="faint">${esc(p.username)} · <span class="mono">${p.role}</span></div></div>
            <button data-act="goto" data-to="/change-password">${ic('lock')} Change password</button>
            <button data-act="signout">${ic('out')} Sign out</button></div>`:''}</button>
      </header>
      <main class="content">${body}</main>
    </div></div>`;
}

/* =====================================================================
   Router
   ===================================================================== */
function route(){
  const h=(location.hash||'').replace(/^#/,'')||'/';
  const [path,qs]=h.split('?'); return {path:path.replace(/\/$/,'')||'/',qs};
}
function go(to){
  S.drawer=null; S.dialog=null; S.menu=false; S.draft={}; S.err={};
  const same = location.hash==='#'+to;
  location.hash=to;
  if(same) render();   // no hashchange fires when the route is unchanged (e.g. switching persona)
}
function home(){ const p=me(); return p?`/${p.surface}/overview`:'/login'; }

function addrBar(){
  const {path}=route(); const k=hostKind();
  const lock='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const hint = k==='admin' ? 'Admin portal · RVL staff only' : k==='fi' ? `FI portal · ${esc(tenantBySlug(S.host).name)} only` : 'No such portal';
  $('#addr').innerHTML=`<span class="pill">${lock}<span>https://<b>${esc(S.host)}</b>.${DOMAIN}${esc(path==='/'?'':path)}</span></span><span class="faint" style="font-family:var(--font)">${hint}</span>`;
}
function render(){
  const p=me(); const {path}=route(); const k=hostKind();
  document.documentElement.dataset.surface = k==='fi'?'fi':'staff';
  addrBar();
  let html='';
  if(path==='/routes') html = p?shell('Route map',routesPage()):routesPage();
  else if(k==='unknown') html=unknownPortal();
  else if(path==='/login' || (!p && path!=='/change-password')) html=loginPage();
  else if(path==='/change-password') html=changePwPage();
  else if(!p) html=loginPage();
  else {
    // Guard: a session only ever exists on the host it was issued for (host-only cookie, token tenant = host tenant).
    const wantSurface = path.startsWith('/staff')?'staff':path.startsWith('/fi')?'fi':null;
    if(wantSurface && wantSurface!==p.surface){ location.hash=home(); return; }
    html = shell(...pageFor(path,p));
  }
  $('#root').innerHTML=html;
  $('#layer').innerHTML = drawerHtml()+dialogHtml();
}
function unknownPortal(){
  return `<div class="center"><div class="card"><div class="card-b" style="text-align:center">
    <div class="logo" style="margin:0 auto 14px;background:var(--surface-2);color:var(--text-3)">${ic('qr',20)}</div>
    <h1 style="font:700 22px/28px var(--head);margin-bottom:6px">Portal not found</h1>
    <p class="muted" style="margin:0 0 16px">Check the address you were given by your institution or by RVL.</p>
    ${note('Proposed',['An unknown, reserved or terminated slug gets this one generic page. It never says whether a tenant exists.','<code>GET /v1/public/portal-context</code> answers <code>404</code> for these hosts.'])}
  </div></div></div>`;
}

function pageFor(path,p){
  const staff=p.surface==='staff';
  if(path==='/staff/users'){ return p.role==='MASTER_ADMIN'?['Users',usersPage(false)]:['Users',noAccess('staff')]; }
  if(path==='/staff/institutions') return ['Institutions',institutionsPage()];
  if(path==='/staff/institutions/new') return ['New institution',onboardingPage()];
  let m=path.match(/^\/staff\/institutions\/(t\d)(?:\/(users|usage|billing))?$/);
  if(m) return ['Institution',institutionDetail(m[1],m[2]||'overview')];
  if(path==='/fi/users'){ return p.role==='FSP_MASTER_ADMIN'?['Users',usersPage(true)]:['Users',notFound()]; }
  const nm=navFor(p).find(i=>i.to===path);
  return [nm?nm.label:'Overview', stubPage(nm?nm.label:'Overview')];
}
const stubPage = (l)=>`<div class="stub"><b>${esc(l)}</b><p>Unchanged by this proposal. Shown only so the navigation reads like the real portal.</p></div>`;
const noAccess = (s)=>`<div class="stub"><b>You don’t have access to this page</b><p>The API answers <code>403</code> for ${me().role}. The nav hides the link, but the API scope is the real boundary.</p></div>`;
const notFound = ()=>`<div class="stub"><b>Page not found</b><p>An FI User has no Users screen. A direct visit shows this page; the API would return <code>403</code> on <code>/v1/fsp/users</code>.</p></div>`;

/* =====================================================================
   Users page (staff + FI share it; the FI variant has fewer controls)
   ===================================================================== */
function visibleUsers(fi){
  const p=me(); const f=S.f; const q=f.q.trim().toLowerCase();
  return S.data.users.filter(u=>{
    if(fi && u.tenantId!==p.tenantId) return false;           // containment: FI only ever lists its own
    if(!fi){
      if(f.scope==='platform' && u.tenantId) return false;
      if(f.scope==='fi' && !u.tenantId) return false;
      if(f.tenant && u.tenantId!==f.tenant) return false;
    }
    if(f.role && u.role!==f.role) return false;
    if(f.status && u.status!==f.status) return false;
    if(q && !(u.username+u.displayName+u.email).toLowerCase().includes(q)) return false;
    return true;
  });
}
function usersTable(fi){
  const rows=visibleUsers(fi); const p=me();
  const head=`<tr><th>User</th><th>Email</th><th>Role</th>${fi?'':'<th>Institution</th>'}<th>Status</th><th>Last sign-in</th></tr>`;
  const body=rows.length? rows.map(u=>`<tr class="click" data-act="open" data-id="${u.id}">
    <td class="u-name"><b>${esc(u.displayName)}${u.id===p.userId?'<span class="me">You</span>':''}</b><span class="mono">${esc(u.username)}</span></td>
    <td>${esc(u.email)}</td>
    <td>${ROLE[u.role].label}</td>
    ${fi?'':`<td>${u.tenantId?esc(tenant(u.tenantId).name):'<span class="faint">Platform</span>'}</td>`}
    <td>${statusChip(u.status)}${u.mustChange?` ${chip('info','Must change password')}`:''}</td>
    <td class="num">${u.last}</td></tr>`).join('')
    : `<tr><td colspan="${fi?5:6}" class="empty">No users match these filters.</td></tr>`;
  return `<div class="tscroll"><table>${head}${body}</table></div>
    <div style="padding:12px 18px;border-top:1px solid var(--line);color:var(--text-3);display:flex;justify-content:space-between"><span>${rows.length} of ${rows.length} users</span><span>Page 1 · 25 per page</span></div>`;
}
function usersPage(fi){
  const f=S.f; const opt=(v,l,c)=>`<option value="${v}" ${c===v?'selected':''}>${l}</option>`;
  const adminNote = fi ? note('New screen · /fi/users · FSP_MASTER_ADMIN only',[
      'Calls <code>GET /v1/fsp/users</code>; the API scopes the list to the caller’s own FI from the token. The portal never sends a tenant id.',
      'Create form has <b>no role field</b> (the API request type has none). FI admins create FI Users only and cannot promote anyone.',
      'Actions: edit, suspend, reactivate, unlock, reset password, disable. <b>No</b> role change and <b>no</b> revoke-sessions (those exist only on the admin endpoint).',
      'FI Users never see this nav item.']) :
    note('New screen · /staff/users · MASTER_ADMIN only',[
      'Calls <code>GET /v1/admin/users?tenantId&amp;role&amp;status&amp;scope&amp;search&amp;page&amp;pageSize</code> (page size capped at 100). Filters live in the URL query so a list can be shared.',
      'Row opens the detail drawer (DESIGN.md pattern). Deep link: <code>#/staff/users?user=&lt;id&gt;</code>.',
      'OPS / AUDITOR / SUPPORT / FINANCE have no “Access” section: provisionable today, they gate nothing yet.']);
  const filters = fi ? `
      <input class="search" data-filter="q" placeholder="Search name, username, email" value="${esc(f.q)}">
      <select data-filter="role">${opt('','All roles',f.role)}${FI_ROLES.map(r=>opt(r,ROLE[r].label,f.role)).join('')}</select>
      <select data-filter="status">${opt('','All statuses',f.status)}${['ACTIVE','PENDING','SUSPENDED','LOCKED','DISABLED'].map(s=>opt(s,s[0]+s.slice(1).toLowerCase(),f.status)).join('')}</select>`
    : `
      <input class="search" data-filter="q" placeholder="Search name, username, email" value="${esc(f.q)}">
      <select data-filter="scope">${opt('','All users',f.scope)}${opt('platform','Platform staff',f.scope)}${opt('fi','Institution users',f.scope)}</select>
      <select data-filter="tenant">${opt('','All institutions',f.tenant)}${S.data.tenants.map(t=>opt(t.id,t.name,f.tenant)).join('')}</select>
      <select data-filter="role">${opt('','All roles',f.role)}${Object.keys(ROLE).map(r=>opt(r,ROLE[r].label,f.role)).join('')}</select>
      <select data-filter="status">${opt('','All statuses',f.status)}${['ACTIVE','PENDING','SUSPENDED','LOCKED','DISABLED'].map(s=>opt(s,s[0]+s.slice(1).toLowerCase(),f.status)).join('')}</select>`;
  const t = fi ? tenant(me().tenantId) : null;
  return `${adminNote}
    <div class="page-h"><div><h2>Users</h2><p>${fi?`People at ${esc(t.name)} who can sign in to this portal.`:'Everyone who can sign in: RVL staff and institution users.'}</p></div><span class="sp"></span>
      <button class="btn primary" data-act="create">${ic('plus')} ${fi?'Add user':'New user'}</button></div>
    <div class="card"><div class="filters">${filters}</div><div id="utable">${usersTable(fi)}</div></div>`;
}

/* ---------- drawer: user detail / create / edit ---------- */
function activeAdmins(tid){ return S.data.users.filter(u=>u.tenantId===tid && u.role==='FSP_MASTER_ADMIN' && u.status==='ACTIVE').length; }
function drawerHtml(){
  const d=S.drawer; if(!d) return '';
  const fi = me().surface==='fi';
  let inner='';
  if(d.kind==='create') inner=createDrawer(fi,d);
  else if(d.kind==='edit') inner=editDrawer(fi,d);
  else inner=detailDrawer(fi,d);
  return `<div class="scrim" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-modal="true">${inner}</aside>`;
}
function detailDrawer(fi,d){
  const u=user(d.id); if(!u) return '';
  const p=me(); const self=u.id===p.userId; const t=u.tenantId?tenant(u.tenantId):null;
  const dis=u.status==='DISABLED';

function lastAdminBlock(u,what){
  return {title:`Can’t ${what}: this is the last active FI Master Admin`,

const RESERVED = ['admin','www','api','app','mail','portal','static','docs','status'];
function slugError(v,tid){
  v=(v||'').trim();
  if(!/^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$/.test(v)) return 'Use 3–30 lowercase letters, digits or hyphens, starting and ending with a letter or digit.';
  if(RESERVED.includes(v)) return 'That address is reserved.';
  if(S.data.tenants.some(t=>t.slug===v && t.id!==tid)) return 'That address is already taken.';
  return '';
}
function randOtp(){ const a='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789#@%-_'; return Array.from({length:16},()=>a[Math.floor(Math.random()*a.length)]).join(''); }
function toast(msg,bad){ const t=$('#toast'); t.innerHTML=`<div class="toast ${bad?'bad':''}">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>t.innerHTML='',3000); }
function mutate(id,fn,msg){ const u=user(id); fn(u); S.dialog=null; S.drawer={kind:'user',id}; render(); toast(msg); }

      <li><b>Self-action</b> (disable / suspend / reset own account) → <code>409</code>; the buttons are disabled for your own row.</li>
      <li><b>Cross-tenant</b> access is <code>404</code>, never 403. The portal never sends a tenant id; the tenant is the host.</li>
      <li><b>Host binding:</b> the token’s tenant must equal the host’s tenant on every request and refresh. Sessions are host-only cookies, so they never cross subdomains.</li>
      <li><b>No enumeration:</b> unknown, reserved or terminated slugs all show the same “Portal not found”.</li>
      <li><b>One-time passwords</b> appear once, in the secret dialog, and are never stored.</li>
      <li><b>Duplicate</b> username/email → <code>409</code>, shown inline on the field.</li>
      <li><b>Disabled</b> is final; <b>Suspended</b> and <b>Locked</b> are reversible.</li>
      <li>Hiding a button is a convenience. The API scopes are the boundary (AGENTS.md).</li></ul></div></div>
    <div class="card"><div class="card-h"><h3>Frontend footprint (when we build it)</h3></div><div class="card-b"><ul style="margin:0;padding-left:20px;display:grid;gap:6px">
      <li><b>Restructure first</b> (no behaviour change): npm workspaces with <code>packages/shared</code> (today’s <code>src/shared</code>), <code>apps/admin</code> (login + staff screens) and <code>apps/fi</code> (login + FI screens). Apps never import each other.</li>
      <li><code>packages/shared</code>: api client (<code>password_change_required</code>, <code>AuthUser.tenantId</code>), session (per-app role allow-list), new <code>users/</code> module parameterised by base path <code>/v1/admin/users</code> | <code>/v1/fsp/users</code>.</li>
      <li><code>apps/admin</code>: Users screen, Institutions columns and Users tab, onboarding Portal address + FI admin step, cascade dialog copy.</li>
      <li><code>apps/fi</code>: host-aware login (portal-context), Users screen for FI Master Admin.</li>
      <li>Dev: <code>*.localhost</code> (e.g. <code>sonali.localhost:5176</code>) with the proxy forwarding the original host. Deploy: two projects; the edge must forward <code>Host</code> (Vercel rewrites do not, so confirm the production edge).</li>
      <li>Tests: extend <code>src/test/fake-backend.ts</code> with host-scoped login and the users endpoints. No mock data in <code>src</code>.</li></ul></div></div>
    ${me()?'':`<p><a href="#/login">← Back to mock</a></p>`}
  </div>`;
}

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener('click',(ev)=>{
  const el=ev.target.closest('[data-act]');
  if(!el){ if(S.menu){ S.menu=false; render(); } return; }
  const a=el.dataset.act, id=el.dataset.id, p=me();
  if(a==='menu'){ S.menu=!S.menu; render(); ev.stopPropagation(); return; }
  if(a==='goto'){ ev.preventDefault(); go(el.dataset.to); return; }
  if(a==='signout'){ S.persona='anon'; S.forced=false; $('#persona').value='anon'; S.banner=banner('info','Signed out.'); go('/login'); return; }
  if(a==='quick'){ quickLogin(el.dataset.u); return; }
  if(a==='openhost'){ ev.preventDefault(); S.persona='anon'; S.forced=false; $('#persona').value='anon'; S.host=el.dataset.slug; $('#host').value=S.host; S.banner=null; toast('Opens https://'+S.host+'.'+DOMAIN+' in a new tab (a separate session)'); go('/login'); return; }
  if(a==='login'){ doLogin(); return; }
  if(a==='changepw'){ doChangePw(); return; }
  if(a==='open'){ S.drawer={kind:'user',id}; S.draft={}; render(); return; }
  if(a==='closeDrawer'){ S.drawer=null; S.draft={}; S.err={}; render(); return; }
  if(a==='back'){ S.drawer={kind:'user',id}; S.draft={}; render(); return; }
  if(a==='create'){ S.drawer={kind:'create'}; S.draft={}; S.err={}; render(); return; }
  if(a==='create-admin'){ S.drawer={kind:'create'}; S.draft = p.surface==='fi'?{}:{c_scope:'fi',c_tenant:el.dataset.t,c_role:'FSP_MASTER_ADMIN'}; S.err={}; render(); return; }
  if(a==='edit'){ const u=user(id); S.drawer={kind:'edit',id}; S.draft={e_name:u.displayName,e_email:u.email,e_role:u.role}; render(); return; }
  if(a==='saveEdit'){ return saveEdit(id); }
  if(a==='doCreate'){ return doCreate(); }
  if(a==='suspend'){ const u=user(id); S.dialog={kind:'confirm',title:`Suspend ${esc(u.displayName)}?`,text:'They are signed out everywhere and can’t sign in until someone reactivates them.',cta:'Suspend',confirm:'doSuspend',id}; render(); return; }
  if(a==='disable'){ const u=user(id); S.dialog={kind:'confirm',danger:true,title:`Disable ${esc(u.displayName)} permanently?`,text:'This can’t be undone. Their sessions end now. If they need access later you will create a new account.',cta:'Disable permanently',confirm:'doDisable',id}; render(); return; }
  if(a==='reset'){ const u=user(id); S.dialog={kind:'confirm',title:`Reset password for ${esc(u.displayName)}?`,text:'A new one-time password is generated and shown to you once. They are signed out and must choose a new password at next sign-in. Any lockout is cleared.',cta:'Reset password',confirm:'doReset',id}; render(); return; }
  if(a==='revoke'){ const u=user(id); S.dialog={kind:'confirm',title:`Sign ${esc(u.displayName)} out everywhere?`,text:'Every device must sign in again. Their account stays active.',cta:'Sign out everywhere',confirm:'doRevoke',id}; render(); return; }
  if(a==='reactivate'){ mutate(id,u=>u.status='ACTIVE','User reactivated'); return; }
  if(a==='unlock'){ mutate(id,u=>u.status='ACTIVE','Account unlocked'); return; }
  if(a==='closeDialog'){ S.dialog=null; render(); return; }
  if(a==='doSuspend'||a==='doDisable'){
    const u=user(id); const word=a==='doSuspend'?'suspend':'disable';
    if(u.role==='FSP_MASTER_ADMIN' && activeAdmins(u.tenantId)<=1){ S.dialog=null; S.drawer={kind:'user',id,err:lastAdminBlock(u,word)}; render(); return; }
    mutate(id,x=>x.status=a==='doSuspend'?'SUSPENDED':'DISABLED',a==='doSuspend'?'User suspended':'User disabled'); return; }
  if(a==='doReset'){ const u=user(id); u.mustChange=true; if(u.status==='LOCKED') u.status='ACTIVE'; S.dialog={kind:'secret',title:'New one-time password',text:`For ${esc(u.displayName)}. Give it to them directly.`,username:u.username,otp:randOtp()}; render(); return; }
  if(a==='doRevoke'){ mutate(id,()=>{},'All sessions revoked'); return; }
  if(a==='copyOtp'){ try{navigator.clipboard.writeText($('#otp').textContent)}catch(e){} toast('Copied'); return; }
  if(a==='closeSecret'){ S.dialog=null; render(); return; }
  if(a==='step'){ S.onbStep=+el.dataset.i; render(); return; }
  if(a==='mkAdmin'){
    if(!S.draft.o_email){ toast('Enter an email first',true); return; }
    S.data.users.push({id:'u'+(S.data.users.length+1),tenantId:'t3',username:'999993-admin',displayName:S.draft.o_name||'FI Admin',email:S.draft.o_email,role:'FSP_MASTER_ADMIN',status:'ACTIVE',mustChange:true,last:'—'});
    S.dialog={kind:'secret',title:'FI Master Admin created',text:'Hand this one-time password to the institution’s contact.',username:'999993-admin',otp:randOtp()}; render(); return; }
  if(a==='saveSlug'){
    const e=slugError(S.draft.o_slug ?? tenant('t3').slug,'t3'); S.err={slug:e};
    if(!e){ tenant('t3').slug=(S.draft.o_slug ?? tenant('t3').slug).trim(); S.draft={}; toast('Portal address saved'); }
    render(); return; }
  if(a==='idem'){ toast('200 · alreadyExisted: true · no new password'); return; }
  if(a==='activate'){ tenant('t3').status='Active'; toast('Institution activated'); go('/staff/institutions'); return; }
  if(a==='tSuspend'||a==='tTerminate'||a==='tReactivate'){
    const t=tenant(el.dataset.t); const us=S.data.users.filter(u=>u.tenantId===t.id);
    const n=us.filter(u=>!['DISABLED','SUSPENDED'].includes(u.status)).length;
    const cfg = a==='tSuspend'?{title:`Suspend ${esc(t.name)}?`,text:`<b>${n} user${n===1?'':'s'}</b> at this institution will be suspended and signed out immediately, along with its API credentials. Reactivating the institution restores them.`,cta:'Suspend institution',danger:false}
      : a==='tTerminate'?{title:`Terminate ${esc(t.name)}?`,text:`All <b>${us.filter(u=>u.status!=='DISABLED').length} users</b> are <b>disabled permanently</b>. This cannot be undone.`,cta:'Terminate',danger:true}
      : {title:`Reactivate ${esc(t.name)}?`,text:`Suspended users return to Active. Users who were disabled stay disabled.`,cta:'Reactivate',danger:false};
    S.dialog={kind:'confirm',...cfg,confirm:'tDo',id:a+':'+t.id}; render(); return; }
  if(a==='tDo'){
    const [k,tid]=id.split(':'); const t=tenant(tid); const us=S.data.users.filter(u=>u.tenantId===tid);
    if(k==='tSuspend'){ t.status='Suspended'; us.forEach(u=>{ if(!['DISABLED'].includes(u.status)) u.status='SUSPENDED'; }); }
    if(k==='tTerminate'){ t.status='Terminated'; us.forEach(u=>u.status='DISABLED'); }
    if(k==='tReactivate'){ t.status='Active'; us.forEach(u=>{ if(u.status==='SUSPENDED') u.status='ACTIVE'; }); }
    S.dialog=null; render(); toast('Done · users updated'); return; }
});
document.addEventListener('input',(ev)=>{
  const t=ev.target;
  if(t.dataset.draft){ S.draft[t.dataset.draft]=t.value; if(t.dataset.rerender){ render(); } }
  if(t.dataset.filter){ S.f[t.dataset.filter]=t.value; const fi=me().surface==='fi'; $('#utable').innerHTML=usersTable(fi); }
  if(t.dataset.ack!==undefined){ $('#done').disabled=!t.checked; }
});
document.addEventListener('change',(ev)=>{
  const t=ev.target;
  if(t.dataset.draft && t.tagName==='SELECT'){ S.draft[t.dataset.draft]=t.value; if(t.dataset.rerender) render(); }
  if(t.dataset.filter){ S.f[t.dataset.filter]=t.value; const fi=me().surface==='fi'; $('#utable').innerHTML=usersTable(fi); }
});

function quickLogin(uid){
  const u=user(uid); S.banner=null;
  S.draft={lu:u.username,lp:'Passw0rd!'};
  doLogin();
}
function syncPersona(){
  const sel=$('#persona'); const alias=Object.keys(PERSONA_USER).find(k=>PERSONA_USER[k]===S.persona);
  const want = S.persona==='anon' ? 'anon' : (alias || S.persona);
  if([...sel.options].some(o=>o.value===want)) sel.value=want;
}
function doLogin(){
  const id=(S.draft.lu||'').trim().toLowerCase(), pw=S.draft.lp||'';
  if(!id||!pw){ S.banner=banner('bad','Enter your username or email and your password.'); render(); return; }
  // Tenant scope comes from the host. A browser at admin.* can only ever see platform users;
  // at <slug>.* only that tenant's users.
  const t = hostKind()==='fi' ? tenantBySlug(S.host) : null;
  const u = S.data.users.find(x=> (t ? x.tenantId===t.id : !x.tenantId) && (x.username.toLowerCase()===id || x.email.toLowerCase()===id));
  const ut = u&&u.tenantId?tenant(u.tenantId):null;
  const blocked=!u || ['DISABLED','LOCKED','SUSPENDED'].includes(u.status) || (ut&&['Suspended','Terminated'].includes(ut.status));
  if(blocked){ S.banner=banner('bad','Invalid credentials.','Check your username or email and password, or contact your administrator.'); render(); return; }
  S.banner=null; S.persona=u.id; syncPersona(); S.forced=u.mustChange; go(u.mustChange?'/change-password':home());
}
function doChangePw(){
  const a=S.draft.cp1, b=S.draft.cp2, c=S.draft.cp3;
  S.pwErr='';
  if(!a||!b||!c) S.pwErr='Fill in all three fields.';
  else if(b.length<8) S.pwErr='Use at least 8 characters.';
  else if(b!==c) S.pwErr='The new passwords don’t match.';
  if(S.pwErr){ render(); return; }
  S.persona='anon'; S.forced=false; $('#persona').value='anon';
  S.banner=banner('ok','Password changed.','Sign in again with your new password.'); S.draft={}; go('/login');
}
function saveEdit(id){
  const u=user(id); const d=S.draft; const fi=me().surface==='fi';
  if(!d.e_name||!d.e_email){ toast('Name and email are required',true); return; }
  if(!fi && u.role==='FSP_MASTER_ADMIN' && d.e_role!=='FSP_MASTER_ADMIN' && activeAdmins(u.tenantId)<=1){
    S.drawer={kind:'edit',id,err:lastAdminBlock(u,'demote')}; render(); return; }
  u.displayName=d.e_name; u.email=d.e_email; if(!fi) u.role=d.e_role;
  S.drawer={kind:'user',id}; S.draft={}; render(); toast('Saved');
}
function doCreate(){
  const d=S.draft; const p=me(); const fi=p.surface==='fi'; S.err={};
  const scope=fi?'fi':(d.c_scope||'platform');
  if(scope==='fi'&&!fi&&!d.c_tenant) S.err.tenant='Choose an institution.';
  if(!d.c_name) S.err.name='Enter a display name.';
  if(!d.c_user) S.err.user='Enter a username.';
  if(!d.c_email||!/.+@.+/.test(d.c_email)) S.err.email='Enter a valid email.';
  if(!S.err.user && S.data.users.some(u=>u.username===d.c_user && u.tenantId===(scope==='fi'?(fi?p.tenantId:d.c_tenant):null))) S.err.user='email or username already exists.';
  if(!S.err.email && S.data.users.some(u=>u.email===d.c_email)) S.err.email='email or username already exists.';
  if(Object.keys(S.err).length){ render(); return; }
  const role = fi?'FSP_USER':(d.c_role|| (scope==='fi'?'FSP_USER':'OPS'));
  const tid = scope==='fi'?(fi?p.tenantId:d.c_tenant):null;
  const nu={id:'u'+(S.data.users.length+1),tenantId:tid,username:d.c_user,displayName:d.c_name,email:d.c_email,role,status:'ACTIVE',mustChange:true,last:'—'};
  S.data.users.push(nu); S.drawer=null; S.draft={};
  S.dialog={kind:'secret',title:'User created',text:`${esc(nu.displayName)} must change this password at first sign-in.`,username:nu.username,otp:randOtp()}; render();
}

/* ---- mock bar ---- */
$('#persona').addEventListener('change',(e)=>{
  S.persona=e.target.value; S.forced=false; S.drawer=null; S.dialog=null; S.f={q:'',scope:'',tenant:'',role:'',status:''}; S.banner=null;
  const u=S.persona==='anon'?null:user(PERSONA_USER[S.persona]);
  if(u){ S.host=hostOfUser(u); $('#host').value=S.host; }   // an account only exists on its own address
  go(S.persona==='anon'?'/login':home());
});
$('#host').addEventListener('change',(e)=>{
  S.host=e.target.value; S.persona='anon'; S.forced=false; S.drawer=null; S.dialog=null; S.banner=null; syncPersona();
  go('/login');   // a different address is a different origin: no shared session
});
$('#btnNotes').addEventListener('click',(e)=>{ document.body.classList.toggle('notes'); e.target.classList.toggle('on'); });
$('#btnRoutes').addEventListener('click',()=>{ go('/routes'); });
$('#btnReset').addEventListener('click',()=>{ S.data=seed(); S.persona='admin'; S.host='admin'; $('#host').value='admin'; syncPersona(); S.drawer=null; S.dialog=null; S.onbStep=5; render(); toast('Mock data reset'); });
$('#btnTheme').addEventListener('click',()=>{ const h=document.documentElement; const dark=h.dataset.theme==='dark'||(!h.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches); h.dataset.theme=dark?'light':'dark'; });
window.addEventListener('hashchange',render);
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'){ if(S.dialog&&S.dialog.kind!=='secret') S.dialog=null; else if(S.drawer) S.drawer=null; else return; render(); } });

if(!location.hash) location.hash = '/staff/users';
render();
