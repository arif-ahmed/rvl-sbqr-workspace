# Scheduled secret scan across the orchestrator and all submodules.
# The backend .env has held live cloud keys — a leaked pointer bump or doc
# paste is one accident away from exposure. Runs weekly + on PRs touching
# docs/plans (plan docs sometimes embed credentials).

name: secrets-scan

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  pull_request:
    paths:
      - "docs/**"
      - "**.env.example"
      - ".mcp.json"
      - "opencode.json"
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: gitleaks/gitleaks-action@v2
